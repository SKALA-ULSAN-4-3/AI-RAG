[project]
name = "ai-investment-scout"
version = "0.1.0"
description = "AI 스타트업 투자 가능성 평가 시스템 - 오케스트레이션/후보 탐색 모듈"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.0.1",
    "langchain-core>=1.0.0",
    "python-dotenv>=1.2.1",
]

[project.optional-dependencies]
# 실제 웹 검색 모드에서만 필요 (mock 실행/테스트에는 불필요)
live-search = ["langchain-tavily>=0.2.12"]
# Hugging Face 공개 임베딩을 로컬에서 실행할 때 설치합니다.
embeddings = ["sentence-transformers>=5.1.0", "peft>=0.17", "transformers>=4.51"]
production = ["langchain-tavily>=0.2.12", "sentence-transformers>=5.1.0", "peft>=0.17", "transformers>=4.51"]
# 기술 RAG: CPU FAISS, PDF 추출, 웹 PDF 저장, OpenAI 구조화 응답.
tech-rag = ["faiss-cpu>=1.10", "numpy>=1.26", "pypdf>=6.0", "fonttools>=4.0", "playwright>=1.50", "openai>=2.0"]

[dependency-groups]
dev = ["pytest>=8.3.0"]

[project.scripts]
investment-scout = "investment_scout.cli:main"
tech-rag = "investment_scout.rag.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/investment_scout"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
